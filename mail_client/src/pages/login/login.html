<main class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Login</h2>
      <p>Willkommen zurück! Bitte loggen Sie sich ein.</p>
    </div>
    <app-login-form (login)="handleLogin($event)"></app-login-form>
    <p class="auth-switch-text">Noch kein Konto? <a routerLink="/register">Hier registrieren</a></p>
  </div>
</main>
