<form
  [formGroup]="form"
  >

  <app-recipient-input
    label="An"
    formControlName="to">
  </app-recipient-input>

  <app-recipient-input
    label="Cc"
    formControlName="cc">
  </app-recipient-input>

  <app-recipient-input
    label="Bcc"
    formControlName="bcc">
  </app-recipient-input>

  <app-recipient-input
    label="Reply-To"
    formControlName="replyTo">
  </app-recipient-input>

  <mat-form-field appearance="outline">
    <mat-label>Betreff</mat-label>

    <input
      matInput
      formControlName="subject">

    @if(form.controls.subject.hasError('required')){
      <mat-error>
        Bitte einen Betreff angeben.
      </mat-error>
    }

  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Nachricht</mat-label>

    <textarea
      matInput
      rows="15"
      formControlName="bodyText">
    </textarea>

  </mat-form-field>

  @if(form.hasError('noRecipient')){
    <mat-error>
      Mindestens ein Empfänger muss angegeben werden.
    </mat-error>
  }

  <div class="actions">

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onSend()">

      Senden

    </button>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onSave()">

      Entwurf speichern

    </button>



  </div>

</form>
