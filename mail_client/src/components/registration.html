
 <form class="example-form" (ngSubmit)="onRegister()">
    <mat-form-field class="example-full-width">
      <mat-label>First Name</mat-label>
      <input matInput placeholder="Ex. Max" type = "text" name="firstName" [(ngModel)]="firstName" required>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Last Name</mat-label>
      <input matInput placeholder="Ex. Mustermann" type = "text" name="lastName" [(ngModel)]="lastName" required>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>E-Mail</mat-label>
      <input matInput placeholder="Ex. max@mustermann.de" type = "text" name="email" [(ngModel)]="email" required>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Password</mat-label>
      <input matInput type = "password" name="password" [(ngModel)]="password" required>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Confirm Password</mat-label>
      <input matInput type = "password" name="passwordConfirm" [(ngModel)]="passwordConfirm" required>
    </mat-form-field>

  <button mat-button type="submit">Register</button>
</form>
