
 <form class="registration-form" (ngSubmit)="onRegister()">
    <mat-form-field class="registration-form-field">
      <label mat-label for="reg-firstName">First Name</label>
      <input id="reg-firstName" matInput placeholder="Ex. Max" type="text" name="firstName" [(ngModel)]="firstName" required>
    </mat-form-field>

    <mat-form-field class="registration-form-field">
      <label mat-label for="reg-lastName">Last Name</label>
      <input id="reg-lastName" matInput placeholder="Ex. Mustermann" type="text" name="lastName" [(ngModel)]="lastName" required>
    </mat-form-field>

    <mat-form-field class="registration-form-field">
      <label mat-label for="reg-email">E-Mail</label>
      <input id="reg-email" matInput placeholder="Ex. max@mustermann.de" type="text" name="email" [(ngModel)]="email" required>
    </mat-form-field>

    <mat-form-field class="registration-form-field">
      <label mat-label for="reg-password">Password</label>
      <input id="reg-password" matInput type="password" name="password" [(ngModel)]="password" required>
    </mat-form-field>

    <mat-form-field class="registration-form-field">
      <label mat-label for="reg-passwordConfirm">Confirm Password</label>
      <input id="reg-passwordConfirm" matInput type="password" name="passwordConfirm" [(ngModel)]="passwordConfirm" required>
    </mat-form-field>

  <button mat-button type="submit">Register</button>
</form>
