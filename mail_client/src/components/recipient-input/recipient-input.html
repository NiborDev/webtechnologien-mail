<mat-form-field appearance="outline">

  <mat-label>{{label()}}</mat-label>

  <mat-chip-grid #grid>

    @for(mail of recipients(); track mail){

      <mat-chip-row
        (removed)="remove(mail)">

        {{mail}}

        <button
          matChipRemove
          type="button">

          ✕

        </button>

      </mat-chip-row>

    }

    <input

      [disabled]="disabled"

      [matChipInputFor]="grid"

      [matChipInputSeparatorKeyCodes]="separatorKeys"

      [matChipInputAddOnBlur]="true"

      (matChipInputTokenEnd)="add($event)">

  </mat-chip-grid>

</mat-form-field>
