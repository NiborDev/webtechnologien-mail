spring:
  application:
    name: backendmail
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


  datasource:
    url: jdbc:h2:mem:emailapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: emailapp
    password: "hz12!ss?_t6"

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true

server:
  servlet:
    context-path: /api/v1

app:
  name: backendmail
  secret: ${APP_SECRET:my-pepper-secret-for-password-encoding}
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-which-is-secure-enough-for-hmac256}
    expires-seconds: 86400
  storage:
    location: uploads/attachments